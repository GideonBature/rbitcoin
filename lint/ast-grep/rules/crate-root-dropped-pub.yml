id: crate-root-dropped-pub
language: rust
severity: error
message: Dropped X-04 crate-root name must not be `pub use`d (CONTRIBUTING principle 11).
note: This denylist is the fail-closed half of the X-04 crate-root list. Names other crates import still have to compile.
rule:
  kind: use_declaration
  regex: "(?s)\\bpub\\s+use\\b[\\s\\S]*\\b(AddressHead|SegmentedTxHead|LiveShardTable|decode_packed_tx|encode_packed_tx|ScriptsPhaseHandle|NetConfig|P2PHandle|UringSession|SortedHeadWriter|take_raw_clone_n|reset_tx_full_gets|tx_full_gets|txid_get_many_fks|reset_txid_get_many|write_sorted_run|list_runs|list_materialize_claims|next_run_path)\\b"
ignores:
  - "**/*tests*.rs"
  - "**/tests/**"
  - "**/benches/**"
