[package]
name = "rbitcoin-query"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Query API over the rbitcoin store"

[dependencies]
rbitcoin-consensus = { workspace = true }
rbitcoin-primitives = { workspace = true }
rbitcoin-store = { workspace = true }
rbitcoin-log = { workspace = true }
bitcoin = { workspace = true }
arc-swap = { workspace = true }
# Attribute only. cargo-mutants reads it; it does not change compiled code.
mutants = "0.0.4"

[features]
test-hooks = []

[dev-dependencies]
# Height-index tests write a raw confirmed slot. Dependents of this crate
# do not turn the feature on.
rbitcoin-store = { workspace = true, features = ["test-hooks"] }

[lints]
workspace = true
