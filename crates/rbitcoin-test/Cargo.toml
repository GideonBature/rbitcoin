[package]
name = "rbitcoin-test"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "High-level functional and integration tests for rbitcoin"
publish = false
autotests = false

[lib]
doctest = false

[dependencies]
rbitcoin-primitives = { workspace = true }
rbitcoin-store = { workspace = true }
rbitcoin-query = { workspace = true }
rbitcoin-consensus = { workspace = true }
rbitcoin-net = { workspace = true, features = ["test-hooks"] }
rbitcoin-rpc = { workspace = true }
rbitcoin-electrum = { workspace = true }
rbitcoin-esplora = { workspace = true }
rbitcoin-sv2 = { workspace = true, features = ["test-hooks"] }
rbitcoin-cli = { workspace = true }
rbitcoin-node = { workspace = true }
rbitcoin-log = { workspace = true }
bitcoin = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
binary_sv2 = { workspace = true }
template_distribution_sv2 = { workspace = true }

[dev-dependencies]
# Tip-flush journeys hold or fail the IBD flush thread. Dependents do not.
rbitcoin-query = { workspace = true, features = ["test-hooks"] }

[[bin]]
name = "journey-node"
path = "src/bin/journey-node.rs"
test = false

# One harness: the default journeys link once and share pads. `overlay`
# stays its own target because it is feature-gated.
[[test]]
name = "journeys"
path = "tests/journeys.rs"

[features]
mutants = []
# Live private-mesh journeys. Default `cargo test` stays fake SOCKS/SAM/control.
overlay = []

[[test]]
name = "overlay"
path = "tests/overlay.rs"
required-features = ["overlay"]

[lints]
workspace = true
