[package]
name = "rbitcoin-consensus"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Block and transaction validation / confirmability"

[features]
# Lets script-oracle call the Core script assembler. Off for the node.
corpus = ["dep:serde_json"]
# Nightly cargo-mutants only. Off for the node build.
mutants = ["dep:mutants"]

[dependencies]
rbitcoin-primitives = { workspace = true }
arc-swap = { workspace = true }
bitcoin = { workspace = true }
bitcoin_hashes = { workspace = true }
# Corpus rows are JSON. The node build leaves this feature off.
serde_json = { workspace = true, optional = true }
# Attribute only. cargo-mutants reads it; it does not change compiled code.
mutants = { version = "0.0.4", optional = true }
# Parallel script checks use in-crate `script_pool` (std threads) — no rayon.

[dev-dependencies]
serde_json = { workspace = true }
# Test-only zstd decode for Floresta historical block packs (not on the node graph).
ruzstd = "0.9"
# Spend-checkpoint tests call the store hooks. This feature stays off for
# dependents of this crate.
rbitcoin-store = { workspace = true, features = ["test-hooks"] }

[lints]
workspace = true
